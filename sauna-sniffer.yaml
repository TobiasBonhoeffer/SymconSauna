# WEKA Saunabus – passiver Sniffer (nur Empfang!)
# Hardware: XIAO ESP32C3 (oder anderes ESP32-C3) + RS-485-Modul (MAX3485/MAX485)
#
# Verdrahtung:
#   RS-485 A  -> Bus A      RS-485 B -> Bus B      GND -> Bus GND (gemeinsame Masse!)
#   RS-485 RO -> GPIO20 (XIAO D7)
#   RS-485 DE + RE -> GND  (dauerhaft Empfang, sendet nie)
#   DI / TX NICHT anschließen
#   Modul-VCC -> 3V3 des ESP
# Vorher: Busadern mit Multimeter messen (Versorgung, GND, A/B).
# Arbeiten nur im spannungsfreien Zustand – im Gehäuse liegt 400 V!

esphome:
  name: sauna-sniffer

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # Log über USB, UART bleibt frei

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
  - platform: web_server   # Firmware-Upload über die Webseite

uart:
  id: saunabus
  rx_pin: GPIO20
  baud_rate: 19200       # per Oszilloskop gemessen (Bitbreite ~52 µs)
  data_bits: 8
  parity: NONE           # falls nur Müll kommt: auch EVEN testen
  stop_bits: 1
  rx_buffer_size: 512
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 4ms       # Pause zwischen Paketen = Paketende
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# Baudrate zur Laufzeit umschalten (Webseite), ohne neu zu flashen
select:
  - platform: template
    name: "Baudrate"
    optimistic: true
    options:
      - "9600"
      - "19200"
      - "38400"
      - "57600"
      - "76800"
      - "115200"
      - "250000"
    initial_option: "19200"
    on_value:
      - lambda: |-
          id(saunabus).set_baud_rate(std::stoi(x));
          id(saunabus).load_settings(false);
          ESP_LOGW("baud", "Baudrate jetzt %s", x.c_str());

# Webseite mit Marker-Knopf: im Browser http://sauna-sniffer.local öffnen
web_server:
  port: 80

# Marker per BOOT-Taste am XIAO (GPIO9) – nach dem Start frei nutzbar
binary_sensor:
  - platform: gpio
    name: "Marker Taste"
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - logger.log:
          level: WARN
          format: "========== MARKER =========="

# Marker-Knopf (Webseite / Home Assistant): vor jedem Tastendruck am
# WEKA-Bedienteil drücken, dann lassen sich die Pakete eindeutig zuordnen.
button:
  - platform: template
    name: "Sniffer Marker"
    on_press:
      - logger.log:
          level: WARN
          format: "========== MARKER =========="
