<!-- Sauna-Kachel für die Symcon-Kachel-Visualisierung (HTML-SDK) -->
<style>
  .sx { --bg:#170F17; --card:#21151F; --border:#3A2533; --chip:#261823; --chipB:#3E2838; --track:#3B2636;
        --btn:#2C1C29; --btnB:#4A3043; --sub:#28192A; --subB:#42293C; --text:#F5E8EF; --text2:#E8D6E0;
        --muted:#BFA2B4; --light:#FFC9A0; --big:#FFF5F0; --accent:#F07A3A; --hold:#93604A; --idle:#4E3446;
        --hum:#3463C8; --humText:#8EAEEA; --onBg:#3A2014; --onB:#8E4F2C; --warnBg:#4A2A12; --warnB:#B0602A;
        --warnT:#FFC58F; --onAccent:#1A0B06;
        position:absolute; inset:0; overflow:hidden; background:var(--bg); display:flex; align-items:center; justify-content:center;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text); }
  .sx * { box-sizing:border-box; }
  .sx button { font-family:inherit; cursor:pointer; }
  .sx button:disabled { cursor:default; opacity:.45; }
  .sx .stage { width:480px; height:800px; padding:18px; display:flex; flex-direction:column; gap:10px; transform-origin:center center; flex-shrink:0; }
  .sx .num { font-family:"Space Grotesk", Inter, system-ui, sans-serif; }
  .sx .row { display:flex; align-items:center; }
  .sx .between { justify-content:space-between; }
  .sx .card { background:var(--card); border:1px solid var(--border); }
  .sx .round { border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--btn); border:1px solid var(--btnB); color:var(--text); }
  .sx .chip { display:flex; align-items:center; gap:6px; height:32px; padding:0 10px; border-radius:16px; font-size:12px; font-weight:500;
              background:var(--chip); border:1px solid var(--chipB); color:var(--muted); }
  .sx .chip.on { background:var(--onBg); border-color:var(--onB); color:var(--light); }
  .sx .label { font-size:12px; color:var(--muted); letter-spacing:1.2px; }
  .sx .tile { height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:15px; font-weight:600;
              background:var(--card); border:1px solid var(--border); color:var(--text2); }
  .sx .tile.on { background:var(--onBg); border-color:var(--onB); color:var(--light); }
  .sx .tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:5px; border-radius:16px; }
  .sx .tab { height:42px; border-radius:11px; border:none; font-size:15px; background:transparent; color:var(--text2); font-weight:500; }
  .sx .tab.on { background:var(--accent); color:var(--onAccent); font-weight:600; }
  .sx .tab small { display:block; font-size:10px; font-weight:500; opacity:.8; }
  .sx .hidden { display:none !important; }
  .sx .kv { display:flex; justify-content:space-between; gap:8px; font-size:13px; line-height:1.55; }
  .sx .kv span:first-child { color:var(--muted); }
  .sx input.dur { -webkit-appearance:none; appearance:none; width:100%; height:24px; background:transparent; margin:0; touch-action:none; }
  .sx input.dur::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(to right, var(--accent) var(--p, 0%), var(--track) var(--p, 0%)); }
  .sx input.dur::-moz-range-track { height:6px; border-radius:3px; background:var(--track); }
  .sx input.dur::-moz-range-progress { height:6px; border-radius:3px; background:var(--accent); }
  .sx input.dur::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; margin-top:-9px; border-radius:50%; background:var(--bg); border:4px solid var(--light); }
  .sx input.dur::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--bg); border:4px solid var(--light); }
  .sx .fav { flex-shrink:0; height:46px; padding:0 14px; border-radius:14px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:1px;
             background:var(--card); border:1px solid var(--border); color:var(--text); }
  .sx .fav.on { background:var(--onBg); border-color:var(--accent); }
  .sx .fav b { font-size:14px; font-weight:600; white-space:nowrap; }
  .sx .fav i { font-style:normal; font-size:11px; color:var(--muted); white-space:nowrap; }
</style>

<div class="sx" id="sx">
 <div class="stage" id="stage">

  <!-- ================= HAUPTSEITE ================= -->
  <div id="pMain" style="display:flex; flex-direction:column; gap:10px; height:100%">
    <div class="row between" style="height:44px">
      <span class="num" style="font-size:26px; font-weight:700; letter-spacing:.5px">Sauna</span>
      <button class="round" style="width:44px; height:44px; background:var(--card); border-color:var(--border); color:var(--muted)" aria-label="Technik-Seite öffnen" onclick="sxPage('tech')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

    <div class="row between" style="gap:8px; height:32px">
      <span class="chip" style="color:var(--text); font-size:13px; padding:0 12px">
        <span id="dot" style="width:9px; height:9px; border-radius:50%; background:var(--idle)"></span><span id="statusText">–</span>
      </span>
      <div class="row" style="gap:6px">
        <span class="chip" id="doorChip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4a1 1 0 0 1 1-1h9l3 2v16"/><path d="M3 21h18"/><circle cx="14" cy="12" r="1"/></svg>
          <span>Tür –</span>
        </span>
        <span class="chip" id="armChip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg>
          <span id="armText">Fernstart aus</span>
        </span>
      </div>
    </div>

    <div class="tabs card">
      <button class="tab on">Finnisch</button>
      <button class="tab" disabled>Bio<small>folgt</small></button>
      <button class="tab" disabled>Dampf<small>folgt</small></button>
    </div>

    <div class="card" style="flex:1; min-height:0; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px 16px">
      <div class="row" style="gap:10px">
        <button class="round" style="width:56px; height:56px" aria-label="Zieltemperatur senken" onclick="sxSoll(-1)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <div id="dial" style="position:relative; width:230px; height:230px; touch-action:none; cursor:pointer">
          <svg width="230" height="230" viewBox="0 0 300 300" role="slider" aria-label="Solltemperatur" aria-valuemin="40" aria-valuemax="110">
            <circle cx="150" cy="150" r="118" fill="none" stroke="var(--track)" stroke-width="16" stroke-linecap="round" stroke-dasharray="556 742" transform="rotate(135 150 150)"/>
            <circle id="ring" cx="150" cy="150" r="118" fill="none" stroke="var(--idle)" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 742" transform="rotate(135 150 150)"/>
            <circle id="marker" cx="150" cy="150" r="13" fill="var(--bg)" stroke="var(--light)" stroke-width="4"/>
          </svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; pointer-events:none">
            <span style="font-size:13px; font-weight:500; color:var(--muted); letter-spacing:1.5px">IST</span>
            <span class="num" style="font-size:74px; font-weight:600; line-height:1; color:var(--big)"><span id="ist">–</span><span style="font-size:36px; vertical-align:top; color:var(--light)">°</span></span>
            <span style="font-size:16px; color:var(--light); font-weight:500">Ziel <span id="soll">–</span> °C</span>
          </div>
        </div>
        <button class="round" style="width:56px; height:56px" aria-label="Zieltemperatur erhöhen" onclick="sxSoll(1)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
      <span id="heat" class="row" style="gap:6px; height:24px; font-size:14px; font-weight:600; color:var(--muted)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.7 1.6-3.6C10 9.6 11 11 11 11s1-2.5 1-8z"/><path d="M6 21h12"/></svg>
        <span id="heatText">Ofen aus</span>
      </span>
    </div>

    <div class="card" style="border-radius:18px; padding:10px 10px 10px 16px; display:flex; flex-direction:column; gap:6px">
      <div class="row between" style="gap:8px">
        <div style="display:flex; flex-direction:column">
          <span class="label" id="timeLabel">DAUER</span>
          <span class="num" id="timeBig" style="font-size:28px; font-weight:600; line-height:1.1">–</span>
        </div>
        <div class="row" style="gap:8px">
          <span id="timeSmall" style="font-size:12px; color:var(--muted)"></span>
          <button class="round" style="width:44px; height:44px" aria-label="Dauer um 1 Minute verkürzen" onclick="sxDauer(-1)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button class="round" style="width:44px; height:44px" aria-label="Dauer um 1 Minute verlängern" onclick="sxDauer(1)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
      </div>
      <div id="barWrap" style="height:4px; border-radius:2px; background:var(--track); overflow:hidden">
        <div id="bar" style="height:4px; border-radius:2px; width:0; background:var(--hold)"></div>
      </div>
      <label for="durSlider" class="hidden">Dauer</label>
      <input id="durSlider" class="dur" type="range" min="5" max="240" step="5" value="90" aria-label="Dauer">
    </div>

    <div class="row" style="gap:8px; height:50px">
      <div id="favs" class="row" style="flex:1; min-width:0; gap:8px; overflow-x:auto"></div>
      <button aria-label="Aktuelle Einstellung als Favorit speichern" onclick="sxFavAdd()" style="width:46px; height:46px; flex-shrink:0; border-radius:14px; background:var(--card); border:1px dashed var(--onB); color:var(--light); display:flex; align-items:center; justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>
      </button>
    </div>

    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px">
      <button class="tile" id="lightBtn" onclick="sxLicht()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>
        <span id="lightText">Licht</span>
      </button>
      <button class="tile" disabled title="Fernstart-Freigabe nur am Panel an der Sauna">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>Freigabe am Panel</span>
      </button>
    </div>

    <button id="mainBtn" onclick="sxMain()" style="height:60px; flex-shrink:0; border-radius:18px; display:flex; align-items:center; justify-content:center; gap:10px; font-size:18px; font-weight:600; background:transparent; border:2px solid var(--accent); color:var(--light)">
      <span id="mainText">–</span>
    </button>
  </div>

  <!-- ================= TECHNIK ================= -->
  <div id="pTech" class="hidden" style="flex-direction:column; gap:10px; height:100%">
    <div class="row" style="gap:12px; height:44px">
      <button class="round" style="width:44px; height:44px; background:var(--card); border-color:var(--border)" aria-label="Zurück" onclick="sxPage('main')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="num" style="font-size:24px; font-weight:700">Technik</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; align-content:start; flex:1; min-height:0" id="techCards"></div>
    <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px">
      <button class="tile" id="masterBtn" onclick="sxMaster()">Master-Betrieb</button>
      <button class="tile" onclick="sxAktion(1)">Standby</button>
      <button class="tile" onclick="sxAktion(2)">Bereit</button>
      <button class="tile" onclick="sxAktion(3)">Ausschalten</button>
    </div>
  </div>
 </div>
</div>

<script>
  var sxD = {};          // letzter Stand aller Werte
  var sxPending = {};    // lokal geänderte Werte bis zur Rückmeldung

  function $(id) { return document.getElementById(id); }
  function sxFmt(min) { if (min === null || min === undefined) return '–'; return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0') + ' h'; }

  function sxFit() {
    var r = $('sx').getBoundingClientRect();
    var s = Math.min(r.width / 480, r.height / 800);
    $('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', sxFit);
  if (window.ResizeObserver) new ResizeObserver(sxFit).observe($('sx'));

  function sxPage(p) {
    $('pMain').classList.toggle('hidden', p !== 'main');
    $('pTech').classList.toggle('hidden', p !== 'tech');
    $('pMain').style.display = p === 'main' ? 'flex' : '';
    $('pTech').style.display = p === 'tech' ? 'flex' : '';
  }

  function val(k) { return (k in sxPending) ? sxPending[k] : sxD[k]; }

  function sxRender() {
    var running = sxD.phase === 'betrieb' || (sxD.status || '').indexOf('In Betrieb') === 0;
    var ist = sxD.ist, soll = val('soll'), dauer = val('dauer');
    var heats = running && ist !== null && ist !== undefined && soll !== undefined && ist < soll - 1;

    $('statusText').textContent = sxD.status || '–';
    $('dot').style.background = running ? 'var(--accent)' : 'var(--idle)';
    $('ist').textContent = (ist === null || ist === undefined) ? '–' : ist;
    $('soll').textContent = soll === undefined ? '–' : soll;

    var frac = function (v) { return Math.max(0, Math.min(1, (v - 20) / 90)); };
    $('ring').setAttribute('stroke-dasharray', (ist == null ? 0 : frac(ist) * 556).toFixed(1) + ' 742');
    $('ring').setAttribute('stroke', heats ? 'var(--accent)' : (running ? 'var(--hold)' : 'var(--idle)'));
    var a = (135 + frac(soll || 20) * 270) * Math.PI / 180;
    $('marker').setAttribute('cx', (150 + 118 * Math.cos(a)).toFixed(1));
    $('marker').setAttribute('cy', (150 + 118 * Math.sin(a)).toFixed(1));
    $('heatText').textContent = heats ? 'Ofen heizt' : (running ? 'Temperatur erreicht' : 'Ofen aus');
    $('heat').style.color = heats ? 'var(--accent)' : 'var(--muted)';

    $('timeLabel').textContent = running ? 'RESTZEIT' : 'DAUER';
    $('timeBig').textContent = running ? sxFmt(sxD.restzeit) : sxFmt(dauer);
    $('timeSmall').textContent = running ? 'Dauer ' + sxFmt(dauer) : '';
    $('barWrap').style.visibility = running ? 'visible' : 'hidden';
    $('bar').style.width = (running && dauer) ? Math.round((sxD.restzeit || 0) / dauer * 100) + '%' : '0';
    if (!sxDurDrag && dauer !== undefined) { $('durSlider').value = dauer; }
    var p = ((($('durSlider').value) - 5) / 235 * 100).toFixed(1) + '%';
    $('durSlider').style.setProperty('--p', p);

    var licht = !!val('licht');
    $('lightBtn').classList.toggle('on', licht);
    $('lightText').textContent = licht ? 'Licht an' : 'Licht aus';
    $('armChip').classList.toggle('on', !!sxD.start_erlaubt);
    $('armText').textContent = sxD.start_erlaubt ? 'Fernstart frei' : 'Fernstart aus';

    $('mainText').textContent = running ? 'Sitzung beenden' : 'Start nur an der Sauna';
    $('mainBtn').disabled = !running;

    // Favoriten
    var f = sxD.favoriten || [];
    var h = '';
    for (var i = 0; i < f.length; i++) {
      var on = f[i].soll === soll && f[i].dauer === dauer;
      h += '<button class="fav' + (on ? ' on' : '') + '" onclick="sxFavApply(' + i + ')" oncontextmenu="sxFavDel(' + i + ');return false;">' +
           '<b>Klassisch ' + f[i].soll + '°</b><i>' + sxFmt(f[i].dauer) + '</i></button>';
    }
    $('favs').innerHTML = h;

    // Technik
    var cards = [
      ['BETRIEB', [['Phase', sxD.phase], ['Master', sxD.master ? 'ein' : 'aus'], ['Start erlaubt', sxD.start_erlaubt ? 'ja' : 'nein'], ['Busfehler', sxD.fehler]]],
      ['OFEN · 84', [['Status', sxD.ofen], ['Ist', ist == null ? '–' : ist + ' °C'], ['Soll', soll + ' °C'], ['Laufzeit', sxD.laufzeit == null ? '–' : sxD.laufzeit + ' min']]],
      ['VERDAMPFER · 88', [['Status', sxD.verdampfer], ['Heizt', sxD.verdampfer_heizt ? 'ja' : 'nein'], ['Feuchte', sxD.feuchtestufe == null ? '–' : sxD.feuchtestufe], ['Kurzzeit', sxD.kurzzeit == null ? '–' : sxD.kurzzeit + ' min']]],
      ['ZÄHLER', [['Betriebsstunden', sxD.betriebsstunden == null ? '–' : sxD.betriebsstunden + ' h'], ['Sitzungen', sxD.sitzungen == null ? '–' : sxD.sitzungen]]]
    ];
    var t = '';
    cards.forEach(function (c) {
      t += '<div class="card" style="border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:6px">' +
           '<span style="font-size:12px; font-weight:600; color:var(--light); letter-spacing:1.2px">' + c[0] + '</span>';
      c[1].forEach(function (r) { t += '<div class="kv"><span>' + r[0] + '</span><span class="num">' + (r[1] === undefined || r[1] === null ? '–' : r[1]) + '</span></div>'; });
      t += '</div>';
    });
    $('techCards').innerHTML = t;
    $('masterBtn').classList.toggle('on', !!sxD.master);
    $('masterBtn').textContent = sxD.master ? 'Master-Betrieb ein' : 'Master-Betrieb aus';
  }

  // vom Modul aufgerufen (erstes Laden und jede Änderung)
  function handleMessage(data) {
    var d = typeof data === 'string' ? JSON.parse(data) : data;
    for (var k in d) { sxD[k] = d[k]; if (!(k === 'soll' && sxDrag) && !(k === 'dauer' && sxDurDrag)) delete sxPending[k]; }
    sxRender();
  }

  function sxSoll(dlt) { var v = Math.max(40, Math.min(110, (val('soll') || 60) + dlt)); sxPending.soll = v; requestAction('soll', v); sxRender(); }
  function sxDauer(dlt) { var v = Math.max(5, Math.min(240, (val('dauer') || 90) + dlt)); sxPending.dauer = v; requestAction('dauer', v); sxRender(); }
  function sxLicht() { var v = !val('licht'); sxPending.licht = v; requestAction('licht', v); sxRender(); }
  function sxMaster() { requestAction('master', !sxD.master); }
  function sxAktion(n) { requestAction('aktion', n); }
  function sxMain() { if (!$('mainBtn').disabled) requestAction('aktion', 3); }
  function sxFavApply(i) { var f = sxD.favoriten[i]; sxPending.soll = f.soll; sxPending.dauer = f.dauer; requestAction('fav_apply', i); sxRender(); }
  function sxFavAdd() { requestAction('fav_add', JSON.stringify({ soll: val('soll'), dauer: val('dauer') })); }
  function sxFavDel(i) { if (confirm('Favorit löschen?')) requestAction('fav_del', i); }


  // ---- Solltemperatur durch Ziehen am Ring ----
  var sxDrag = false;
  function sxDialValue(ev) {
    var r = $('dial').getBoundingClientRect();
    var dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;           // 0° = rechts, im Uhrzeigersinn
    var rel = (ang - 135 + 360) % 360;                        // 0..360 ab Ringanfang (unten links)
    if (rel > 270) rel = (rel > 315) ? 0 : 270;               // Lücke unten: zum näheren Ende
    var t = Math.round(20 + rel / 270 * 90);
    return Math.max(40, Math.min(110, t));
  }
  $('dial').addEventListener('pointerdown', function (ev) {
    sxDrag = true; $('dial').setPointerCapture(ev.pointerId);
    sxPending.soll = sxDialValue(ev); sxRender(); ev.preventDefault();
  });
  $('dial').addEventListener('pointermove', function (ev) {
    if (!sxDrag) return;
    var v = sxDialValue(ev);
    if (v !== sxPending.soll) { sxPending.soll = v; sxRender(); }
  });
  function sxDialEnd(ev) {
    if (!sxDrag) return;
    sxDrag = false;
    requestAction('soll', sxPending.soll);                    // erst beim Loslassen senden
  }
  $('dial').addEventListener('pointerup', sxDialEnd);
  $('dial').addEventListener('pointercancel', sxDialEnd);

  // ---- Dauer per Schieberegler ----
  var sxDurDrag = false;
  $('durSlider').addEventListener('input', function () {
    sxDurDrag = true; sxPending.dauer = parseInt(this.value, 10); sxRender();
  });
  $('durSlider').addEventListener('change', function () {
    sxDurDrag = false; sxPending.dauer = parseInt(this.value, 10);
    requestAction('dauer', sxPending.dauer);                  // erst beim Loslassen senden
  });

  sxPage('main');
  sxFit();
</script>
